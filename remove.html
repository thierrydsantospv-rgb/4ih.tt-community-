<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Remove All Friends</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">REMOVE ALL FRIENDS</h1>

<div class="form-box">

    <input id="token" class="input" placeholder="ACCESS TOKEN">

    <button onclick="removeFriends()" class="btn neon">REMOVER</button>

    <p id="status" class="status"></p>

</div>

<script>
function removeFriends() {
    let token = document.getElementById("token").value;

    if (!token) {
        document.getElementById("status").innerHTML = "Preencha o Token!";
        return;
    }

    let url = `https://controle.thug4ff.com/remove_all?access_token=${token}`;

    fetch(url)
        .then(res => res.text())
        .then(data => {
            document.getElementById("status").innerHTML = "✅ SUCESSO — STATUS ONLINE";
        })
        .catch(err => {
            document.getElementById("status").innerHTML = "❌ ERRO — TENTE NOVAMENTE";
        });
}
</script>

</body>
</html>

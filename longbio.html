<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atualizar Long Bio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">Atualizar LONG BIO</h1>

<div class="form-box">

    <input id="token" class="input" placeholder="ACCESS TOKEN">
    <input id="bio" class="input" placeholder="NOVA BIO">

    <button onclick="sendBio()" class="btn neon">ATUALIZAR</button>

    <p id="status" class="status"></p>

</div>

<script>
function sendBio() {
    let token = document.getElementById("token").value;
    let bio = document.getElementById("bio").value;

    if (!token || !bio) {
        document.getElementById("status").innerHTML = "Preencha tudo!";
        return;
    }

    let url = `https://bio.thug4ff.com/update_bio?access_token=${token}&bio=${bio}&key=nexx`;

    fetch(url)
        .then(res => res.text())
        .then(data => {
            document.getElementById("status").innerHTML = "✅ SUCESSO — STATUS ONLINE";
        })
        .catch(err => {
            document.getElementById("status").innerHTML = "❌ ERRO — TENTE NOVAMENTE";
        });
}
</script>

</body>
</html>
